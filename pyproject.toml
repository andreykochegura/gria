[project]
name = "gria"
version = "0.1.0"
description = "Genetic "
readme = "README.md"
authors = [
    { name = "andreykochegura", email = "andreykochegura@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
]

[project.scripts]
gria = "gria.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
